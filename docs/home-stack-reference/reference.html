<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>首页布局参考视频</title><style>html,body{margin:0;background:#242428;color:#fff;font:14px system-ui}header{height:48px;display:flex;align-items:center;gap:20px;padding:0 20px}input{width:80px}video{display:block;width:100%;height:calc(100vh - 48px);object-fit:contain}button{padding:5px 12px}</style><header><button id="toggle">播放 / 暂停</button><label>时间（秒）<input id="seek" type="number" step="0.1" value="0"></label><span id="info"></span></header><video id="reference" src="./reference.mp4" muted preload="auto" playsinline></video><script>const video=document.getElementById('reference');document.getElementById('toggle').onclick=()=>video.paused?video.play():video.pause();document.getElementById('seek').onchange=e=>{video.pause();video.currentTime=Number(e.target.value)};video.onloadedmetadata=()=>{document.getElementById('info').textContent=`${video.videoWidth} × ${video.videoHeight} · ${video.duration.toFixed(2)}s`};</script></html>
